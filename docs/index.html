<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ATM Stock Scan</title>
<meta name="theme-color" content="#0B4D2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ATM Scan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  @font-face{font-family:"Oswald";font-weight:700;src:url(fonts/oswald-latin-700-normal.woff2) format("woff2");font-display:swap}
  @font-face{font-family:"Archivo";font-weight:400;src:url(fonts/archivo-latin-400-normal.woff2) format("woff2");font-display:swap}
  @font-face{font-family:"Archivo";font-weight:600;src:url(fonts/archivo-latin-600-normal.woff2) format("woff2");font-display:swap}
  @font-face{font-family:"Archivo";font-weight:700;src:url(fonts/archivo-latin-700-normal.woff2) format("woff2");font-display:swap}
  @font-face{font-family:"Archivo";font-weight:800;src:url(fonts/archivo-latin-800-normal.woff2) format("woff2");font-display:swap}
  :root{
    --bg:#FFFDF5; --card:#FFFFFF; --ink:#1B2A22; --muted:#6B7268; --line:#ECE5CF; --soft:#F7F2E2;
    --forest:#0B4D2E; --gold:#B8860B; --gold-ink:#8A6A10; --gold-grad:linear-gradient(135deg,#F7C600,#E8B000 55%,#B8860B);
    --ok:#0B4D2E; --ok-bg:#E3F0E7; --bad:#A12A22; --bad-bg:#FBE6E3; --warn:#7A5C0C; --warn-bg:#FBF1D3;
    --stop:#A12A22; --tgt:#0B4D2E; --accent:#0B4D2E;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0C1712; --card:#13231B; --ink:#EDE8D8; --muted:#A7AE9F; --line:#22382C; --soft:#0F1D16;
      --forest:#E8B000; --gold:#E8B000; --gold-ink:#E9CF7A; --ok:#7FD3A0; --ok-bg:#12321F; --bad:#F2928A; --bad-bg:#3A1714;
      --warn:#F3D27A; --warn-bg:#3A2D0E; --stop:#F2928A; --tgt:#7FD3A0; --accent:#E9CF7A; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Archivo",-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  main{max-width:1120px;margin:0 auto;padding:14px 16px 40px}
  header{display:flex;align-items:center;gap:12px;padding:8px 2px 12px;border-bottom:3px solid transparent;
    border-image:var(--gold-grad) 1;margin-bottom:14px}
  header img{width:46px;height:auto;flex:none}
  .brand{min-width:0;flex:1}
  .brand h1{font:700 26px/1 "Oswald",sans-serif;letter-spacing:1px;margin:0;color:var(--forest);text-transform:uppercase}
  .brand .co{font-weight:700;font-size:11px;letter-spacing:3px;color:var(--forest);opacity:.85;text-transform:uppercase;margin-top:3px}
  .sub{color:var(--muted);font-size:13px;margin:0 2px 12px}
  .actions{display:flex;gap:8px;flex:none}
  button{font:600 14px "Archivo",sans-serif;border:0;border-radius:10px;padding:8px 12px;background:var(--card);color:var(--accent);
    box-shadow:0 0 0 1px var(--line) inset;cursor:pointer;white-space:nowrap}
  button.primary{background:var(--forest);color:#FFFDF5;box-shadow:none}
  @media (prefers-color-scheme: dark){ button.primary{color:#0C1712} }
  button:active{opacity:.7}
  .card{background:var(--card);border-radius:14px;padding:14px;margin:0 0 12px;box-shadow:0 0 0 1px var(--line) inset, 0 1px 2px rgba(60,50,10,.04)}
  .banner{border-radius:12px;padding:10px 12px;margin:0 0 12px;font-weight:600;font-size:14px}
  .ok{background:var(--ok-bg);color:var(--ok)} .bad{background:var(--bad-bg);color:var(--bad)} .warn{background:var(--warn-bg);color:var(--warn)}
  h2{font:700 15px "Oswald",sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:var(--forest);margin:20px 2px 10px;display:flex;align-items:center;gap:8px}
  h2::before{content:"";width:16px;height:3px;background:var(--gold-grad);border-radius:2px}
  .layout{display:grid;gap:0 18px;grid-template-columns:minmax(0,1fr)} .layout > div{min-width:0}
  @media (min-width: 900px){ .layout{grid-template-columns: minmax(0,1.65fr) minmax(0,1fr)} }
  .grid{display:grid;gap:12px;align-items:start}
  @media (min-width: 640px){ .grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
  @media (min-width: 900px){ .grid{grid-template-columns:1fr} }
  @media (min-width: 1100px){ .grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
  .grid .card{margin:0}
  .stage{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin:9px 0;font-size:13px}
  .stage .track{grid-column:1/3;height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
  .stage .fill{height:100%;background:var(--forest);border-radius:3px}
  .stage b{font-variant-numeric:tabular-nums}
  .pick{padding:0;overflow:hidden}
  .pick summary{list-style:none;padding:14px;cursor:pointer}
  .pick summary::-webkit-details-marker{display:none}
  .row1{display:flex;align-items:center;gap:9px}
  .rank{width:28px;height:28px;border-radius:8px;background:var(--gold-grad);color:#0B4D2E;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
  .sym{font:700 19px/1.1 "Oswald",sans-serif;letter-spacing:.5px}
  .name{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tag{margin-left:auto;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;border:1px solid}
  .tag.b{color:var(--gold-ink);border-color:#E9CF7A;background:#FBF4DC} .tag.p{color:#0B4D2E;border-color:#B9D8C4;background:#EEF6F0}
  @media (prefers-color-scheme: dark){ .tag.b{background:#2E250B;border-color:#6B5414} .tag.p{background:#11301E;border-color:#2D5A3E;color:#7FD3A0} }
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .chip{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--soft);color:var(--muted)}
  .chip.okc{background:var(--ok-bg);color:var(--ok)} .chip.wc{background:var(--warn-bg);color:var(--warn)}
  .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .num{background:var(--soft);border-radius:10px;padding:8px}
  .num span{display:block;font-size:11px;color:var(--muted)}
  .num b{font-size:15px;font-variant-numeric:tabular-nums}
  .num.stop b{color:var(--stop)} .num.tgt b{color:var(--tgt)}
  .more{padding:0 14px 14px;font-size:13px;color:var(--muted)}
  .more table{width:100%;border-collapse:collapse;margin:0 0 10px}
  .more td{padding:5px 0;border-bottom:1px solid var(--line)} .more td:last-child{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
  .more button{margin-right:6px}
  .empty{text-align:center;color:var(--muted);padding:24px 10px}
  .circ a{display:block;color:var(--ink);text-decoration:none;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
  .circ a:last-child{border-bottom:0}
  .circ small{color:var(--muted);display:block;font-size:12px}
  .rules{font-size:13px;color:var(--muted)} .rules li{margin:5px 0}
  footer{margin-top:22px;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  footer .tl{color:var(--gold-ink);font-weight:800}
  .setup label{display:block;font-weight:600;margin:6px 0}
  .setup input{width:100%;font:15px "Archivo",sans-serif;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
  .setup p{color:var(--muted);font-size:13px}
  nav.tabs{display:flex;gap:6px;margin:0 0 12px;overflow-x:auto}
  nav.tabs.mode button{font-size:15px;padding:9px 16px}
  nav.tabs.mode button.on{background:var(--gold-grad);color:#0B4D2E}
  .seg{display:flex;gap:6px;flex-wrap:wrap} .seg button.on{background:var(--forest);color:#FFFDF5;box-shadow:none}
  @media (prefers-color-scheme: dark){ .seg button.on{color:#0C1712} }
  .form{display:grid;gap:12px} @media (min-width:640px){ .form{grid-template-columns:1fr 1fr} }
  .form label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
  .form input{width:100%;font:600 16px "Archivo",sans-serif;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
  .big{font:700 22px "Oswald",sans-serif;color:var(--forest)}
  .range{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
  .range .num b{font-size:16px}
  nav.tabs button{box-shadow:0 0 0 1px var(--line) inset;color:var(--muted)}
  nav.tabs button.on{background:var(--forest);color:#FFFDF5;box-shadow:none}
  @media (prefers-color-scheme: dark){ nav.tabs button.on{color:#0C1712} }
  table.mt{width:100%;border-collapse:collapse;font-size:13px}
  table.mt th,table.mt td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
  table.mt th:first-child,table.mt td:first-child{text-align:left;color:var(--muted);font-weight:600}
  table.mt th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .scroll{overflow-x:auto}
  .pos{color:var(--tgt)} .neg{color:var(--stop)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
  .legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
  .rg{display:inline-block;font-weight:800;padding:2px 8px;border-radius:6px;margin-right:6px}
  .rg.green{background:var(--ok-bg);color:var(--ok)} .rg.amber{background:var(--warn-bg);color:var(--warn)} .rg.red{background:var(--bad-bg);color:var(--bad)}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:var(--forest);color:#FFFDF5;padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.on{opacity:1}
  .gauge{position:relative;height:12px;border-radius:6px;background:linear-gradient(90deg,#C0392B 0 35%,#E8B000 35% 50%,#9BBF7A 50% 65%,#0B8A4A 65%);margin:10px 0 4px}
  .gauge i{position:absolute;top:-5px;width:4px;height:22px;border-radius:2px;background:var(--ink);transform:translateX(-2px)}
  .gscale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
  .mv summary{padding:10px 12px} .mv .row1{gap:8px} .mv .sym{font-size:16px}
  .chg{font:700 15px "Archivo",sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
  .why{margin:0;padding:0 12px 12px 30px;font-size:13px;color:var(--ink)} .why li{margin:3px 0}
  .hl{display:block;font-size:12px;color:var(--muted);text-decoration:none;margin:4px 12px 0 12px} .hl:last-child{margin-bottom:12px}
  .bar{display:grid;grid-template-columns:minmax(0,1fr) 60px;gap:2px 8px;font-size:13px;margin:6px 0}
  .bar .t{grid-column:1/3;height:5px;border-radius:3px;background:var(--soft);position:relative;overflow:hidden}
  .bar .t b{position:absolute;top:0;bottom:0}
  .live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#0B8A4A;margin-right:6px;animation:pulse 1.6s infinite}
  @keyframes pulse{50%{opacity:.25}}
  .two{display:grid;gap:12px} @media (min-width:700px){ .two{grid-template-columns:1fr 1fr} }
  .trk td{white-space:nowrap} .trk th{white-space:normal} .trk td:first-child{color:var(--ink)}
  .prog{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:4px;min-width:70px}
  .prog b{display:block;height:100%;border-radius:3px}
  .liveline{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;margin-top:10px;padding:8px 10px;border-radius:10px;background:var(--soft);font-size:13px}
  .liveline b{font-size:15px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<main>
  <header>
    <img src="atm-mark.svg" alt="Absolute Tech Management LLP">
    <div class="brand">
      <h1>Stock Scan</h1>
      <div class="co">Absolute Tech Management L.L.P</div>
    </div>
    <div class="actions">
      <button id="settings" hidden>⚙ Settings</button>
      <button id="refresh" class="primary">↻ Refresh</button>
    </div>
  </header>
  <nav class="tabs mode"><button id="mode-stocks" class="on">📈 Stocks</button><button id="mode-mf">🏦 Mutual funds</button></nav>
  <nav class="tabs" id="stock-tabs"><button id="tab-live" class="on">⚡ Live</button><button id="tab-today">Today's picks</button><button id="tab-paper">Paper record</button><button id="tab-lab">Strategy lab</button></nav>
  <div class="sub" id="asof">Loading…</div>
  <div id="app"></div>
  <footer>
    <span class="tl">“Delivers Absolute Reliance”</span>
    <span>Internal tool for personal use · a screen, not investment advice</span>
  </footer>
</main>
<div class="toast" id="toast"></div>

<script>
const $ = (s, el=document) => el.querySelector(s);
const desktop = window.atmDesktop || null;   // provided by the Windows app
const inr = (x, d=2) => x == null ? "–" : (Number(x) < 0 ? "−₹" : "₹") + Math.abs(Number(x)).toLocaleString("en-IN",{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtDate = s => new Date(s + "T00:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short"});
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"),1800); }

let TAB = "live";
let LIVE_TIMER = null;
async function getJSON(name){
  if(desktop){
    const r = await desktop.fetchJSON(name);
    if(!r.ok && !r.data) throw new Error(r.error || "fetch failed");
    return r.data;
  }
  const r = await fetch("data/" + name + "?t=" + Date.now(), {cache:"no-store"});
  if(!r.ok) throw new Error(r.status);
  return r.json();
}
async function getData(){
  if(desktop){
    const s = await desktop.getSettings();
    if(!s.dataUrl) return {setup:true};
    const r = await desktop.fetchScan();
    if(!r.ok && !r.data) throw new Error(r.error || "fetch failed");
    if(r.cached) toast("Offline – showing last saved scan");
    return r.data;
  }
  const r = await fetch("data/picks.json?t=" + Date.now(), {cache:"no-store"});
  if(!r.ok) throw new Error(r.status);
  return r.json();
}

async function load(){
  $("#asof").textContent = "Loading…";
  for(const t of ["live","today","paper","lab"]) $("#tab-"+t).classList.toggle("on", TAB===t);
  clearInterval(LIVE_TIMER); LIVE_TIMER = null;
  if(TAB === "live") return loadLive();
  $("#mode-stocks").classList.toggle("on", TAB!=="mf"); $("#mode-mf").classList.toggle("on", TAB==="mf");
  $("#stock-tabs").style.display = TAB==="mf" ? "none" : "flex";
  if(TAB === "mf") return loadMF();
  if(TAB === "lab") return loadLab();
  if(TAB === "paper") return loadPaper();
  try{
    const d = await getData();
    if(d.setup) return renderSetup();
    let live = null, sc = null;
    try{ live = await getJSON("live.json"); }catch(e){}
    try{ sc = await getJSON("scorecard.json"); }catch(e){}
    render(d, live, sc);
  }catch(e){
    $("#asof").textContent = "Couldn't load the latest scan.";
    $("#app").innerHTML = `<div class="card empty">No data yet. ${desktop ? "Check the scan address in Settings, or your internet connection." : "The first scan runs after market close on the next trading day."}</div>`;
  }
}

async function renderSetup(){
  const s = desktop ? await desktop.getSettings() : {};
  $("#asof").textContent = "Connect the app to your cloud scanner";
  $("#app").innerHTML = `<div class="card setup" style="max-width:640px">
    <label for="url">Your scanner's web address</label>
    <input id="url" placeholder="https://your-github-username.github.io/stock-scan/" value="${esc(s.dataUrl && s.dataUrl!=='demo' ? s.dataUrl : '')}">
    <p>This is the GitHub Pages address from the setup guide. The app reads the daily picks from it and shows a Windows notification when a new scan lands.</p>
    <label><input type="checkbox" id="autostart" ${s.autoStart ? "checked" : ""} style="width:auto"> Start with Windows (runs in the system tray)</label>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
      <button class="primary" id="save">Save &amp; connect</button>
      <button id="demo">Try with demo data</button>
    </div></div>`;
  $("#save").onclick = async () => {
    const v = $("#url").value.trim();
    if(!/^https:\/\//i.test(v)){ toast("Enter an https:// address"); return; }
    await desktop.saveSettings({dataUrl:v, autoStart:$("#autostart").checked}); load();
  };
  $("#demo").onclick = async () => { await desktop.saveSettings({dataUrl:"demo", autoStart:$("#autostart").checked}); load(); };
}

function render(d, live, sc){
  const gen = d.generated_at ? new Date(d.generated_at).toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"}) : "";
  $("#asof").textContent = `Close of ${new Date(d.as_of+"T00:00:00").toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short",year:"numeric"})}` + (gen ? ` · scanned ${gen}` : "");
  const m = d.market || {};
  let top = "";
  if(d.demo) top += `<div class="banner warn">Demo data – these are not real stocks. Real picks appear after the first live scan.</div>`;
  top += m.ok === true ? `<div class="banner ok">● Market filter ON – Nifty ${m.close?.toLocaleString("en-IN")} is above its 50 DMA (${m.sma50?.toLocaleString("en-IN")}). New trades allowed.</div>`
       : m.ok === false ? `<div class="banner bad">● Market filter OFF – Nifty below its 50 DMA. No new trades today; watch only.</div>`
       : `<div class="banner warn">● Market filter unknown – check Nifty vs its 50 DMA manually.</div>`;
  const rg = d.regime;
  if(rg && rg.regime){
    const cls = {green:"ok", amber:"warn", red:"bad"}[rg.regime];
    top += `<div class="banner ${cls}"><span class="rg ${rg.regime}">${rg.regime.toUpperCase()}</span>${esc(rg.note)}` +
      (rg.breadth != null ? ` <span style="font-weight:400">· breadth ${Math.round(rg.breadth*100)}% of liquid stocks above their 50 DMA</span>` : "") +
      (d.strategy ? ` <span style="font-weight:400">· live strategy: ${d.strategy === "adaptive" ? "regime-adaptive" : "baseline funnel"}</span>` : "") + `</div>`;
  }
  const sm = d.sentiment || {}, md = sm.mood || {};
  if(md.score != null){
    const cls = {fear:"bad", cautious:"warn", neutral:"ok", greed:"ok"}[md.band] || "warn";
    const sug = (sm.list||[]).filter(x => x.status === "suggested").map(x => x.symbol), vet = (sm.list||[]).filter(x => x.status === "vetoed");
    top += `<div class="banner ${cls}">Market Mood ${Math.round(md.score)}/100 (${esc(md.band)}) – ${esc(md.note)}` +
      `<span style="font-weight:400"> · sentiment-adjusted picks: ${sug.length ? esc(sug.join(", ")) : "none"}${vet.length ? " · vetoed: " + vet.map(x => esc(x.symbol + " (" + x.veto + ")")).join(", ") : ""} · details in ⚡ Live</span></div>`;
  }
  (d.warnings||[]).forEach(w => top += `<div class="banner warn">${esc(w)}</div>`);

  const picks = d.picks || [];
  const T = pickTracker(picks, live, d);
  let left = T.html + `<h2>Top ${picks.length} candidates</h2>`;
  if(!picks.length) left += `<div class="card empty">No stock passed every rule today.<br>No trade is a valid result.</div>`;
  left += `<div class="grid">` + picks.map((p,i) => {
    const cls = p.setup.startsWith("Breakout") ? "b" : "p";
    return `<details class="card pick"><summary>
      <div class="row1"><div class="rank">${i+1}</div>
        <div style="min-width:0"><div class="sym">${esc(p.symbol)}</div><div class="name">${esc(p.name||"")}</div></div>
        <span class="tag ${cls}">${esc(p.setup)}</span></div>
      <div class="chips">
        ${p.fund_status === "pass" ? `<span class="chip okc">✓ Fundamentals OK</span>` : p.fund_status === "unknown" ? `<span class="chip wc">⚠ Check fundamentals</span>` : ""}
        ${p.roe_pct != null ? `<span class="chip">ROE ${p.roe_pct}%</span>` : ""}
        ${p.next_results ? `<span class="chip">Results ${fmtDate(p.next_results)}</span>` : ""}
        ${p.low_priced ? `<span class="chip wc">Low-priced</span>` : ""}
      </div>
      ${T.line(p)}
      <div class="nums">
        <div class="num"><span>Entry (limit)</span><b>${inr(p.entry)}</b></div>
        <div class="num stop"><span>Stop-loss</span><b>${inr(p.stop)}</b></div>
        <div class="num tgt"><span>Target (2R)</span><b>${inr(p.target)}</b></div>
        <div class="num"><span>Qty</span><b>${p.qty}</b></div>
        <div class="num"><span>Max loss</span><b>${inr(p.max_loss,0)}</b></div>
        <div class="num"><span>Capital</span><b>${inr(p.capital,0)}</b></div>
      </div></summary>
      <div class="more"><table>

function scorecardCard(sc){

  else h += `<div class="scroll"><table class="mt"><tr><th></th>${hs.map(k => `<th>${lab[k]}</th>`).join("")}</tr>

function pickLive(p, live){
  const px = (live && live.prices && live.prices[p.symbol]) || ((live && live.watch) || []).find(w => w.symbol === p.symbol) || null;
  if(!px || !px.last) return null;
  const last = px.last, diff = last - p.entry, pct = diff / p.entry * 100;
  const left = p.target - last, leftPct = left / last * 100;
  const prog = (last - p.entry) / Math.max(1e-9, p.target - p.entry) * 100;           // 0% at entry, 100% at target
  const toStop = (last / p.stop - 1) * 100;
  const st = [];
  if(px.high != null && px.high >= p.target) st.push(["target touched", "pos"]);
  if(px.low != null && px.low <= p.stop) st.push(["stop touched", "neg"]);
  if(px.open != null && px.open > p.entry * 1.01) st.push(["opened >1% above entry – rules say skip", "neg"]);
  return {last, diff, pct, pnl: diff * (p.qty || 0), left, leftPct, prog, toStop, st, day: px.pchange};
}

  const tot = have.reduce((a, [p, x]) => a + x.pnl, 0), up = have.filter(r => r[1].diff > 0).length, down = have.filter(r => r[1].diff < 0).length;

function split100(total, weights){
  const raw = weights.map(w => total * w / 100), base = raw.map(x => Math.floor(x / 100) * 100);
  let left = Math.round((Math.round(total / 100) * 100 - base.reduce((a,b) => a+b, 0)) / 100);
  raw.map((x,i) => [x - base[i], i]).sort((a,b) => b[0]-a[0]).forEach(([_, i]) => { if(left > 0){ base[i] += 100; left--; } });
  return base;
}

    <div><label>Lump sum (₹)</label><input id="mf-lump" type="number" inputmode="numeric" min="0" step="1000" value="${st.lump}"></div>
    <div><label>Invest the lump sum</label>${seg("deploy", [["now","All now"],["stp6","STP over 6 months"],["stp12","STP over 12 months"]])}</div>
    <div><label>Monthly SIP (₹)</label><input id="mf-sip" type="number" inputmode="numeric" min="0" step="500" value="${st.sip}"></div>
    <div><label>Portfolio</label>${seg("style", [["diversified","Diversified"],["simple","Simple (3 funds)"]])}</div>
  </div></div>`;
  // Allocation table
  const lump = Math.max(0, +st.lump || 0), sip = Math.max(0, +st.sip || 0);
  const months = st.deploy === "stp6" ? 6 : st.deploy === "stp12" ? 12 : 0;
  const liquid = (d.buckets.liquid && d.buckets.liquid.top[0]) || null;
  let small = false;
  const sipSplit = split100(sip, alloc.map(a => a.weight));
  h += `<div class="layout"><div><h2>Your plan</h2><div class="card scroll"><table class="mt"><tr><th>Fund</th><th>%</th><th>Lump sum</th><th>SIP / month</th></tr>` +
    alloc.map((a, i) => { const l = Math.round(lump * a.weight / 100), m = sipSplit[i]; if(sip && m < 500) small = true;
      return `<tr><td style="text-align:left;color:var(--ink);font-weight:600">${a.fund ? esc(a.fund.name) : "–"}<br><span class="sub" style="font-weight:400">${esc(a.label)}</span></td><td>${a.weight}%</td>
        <td>${months ? `${inr(l / months,0)}<br><span class="sub">× ${months} mo</span>` : inr(l,0)}</td><td>${sip ? inr(m,0) : "–"}</td></tr>`; }).join("") +
    `<tr><td style="text-align:left"><b>Total</b></td><td>100%</td><td><b>${months ? inr(lump / months,0) + " × " + months : inr(lump,0)}</b></td><td><b>${sip ? inr(sipSplit.reduce((t,x) => t + x, 0),0) : "–"}</b></td></tr>` +
    `</table>` + (months && liquid ? `<p class="sub" style="margin:10px 0 0">STP: put the ₹${lump.toLocaleString("en-IN")} in <b>${esc(liquid.name)}</b> and set a monthly Systematic Transfer Plan into each fund above for ${months} months. It spreads your entry price over time.</p>` : "") +
    (small ? `<p class="sub" style="margin:8px 0 0;color:var(--warn)">Some SIP slices are under ₹500, below many funds' minimum. Raise the SIP or choose "Simple (3 funds)".</p>` : "") + `</div>`;
  // Projections
  const H = st.horizon, pl = proj.lump && proj.lump[H], ps = proj.sip && proj.sip[H];
  h += `<h2>What past markets say (${H} years)</h2><div class="card">`;
  if(!pl){ h += `<div class="empty">Not enough fund history for a ${H}-year range yet. Try a shorter horizon.</div>`; }
  else{
    const lv = p => lump * pl[p], sv = p => ps ? sip * ps[p] : 0, inv = lump + (ps ? sip * ps.invested : 0);
    h += `<div class="sub" style="margin:0">Invested ₹${Math.round(inv).toLocaleString("en-IN")}. Every ${H}-year period from ${proj.start.slice(0,4)} to ${proj.end.slice(0,4)} (${pl.windows} start months) gave:</div>
      <div class="range"><div class="num"><span>Weak (1 in 10 worse)</span><b>${inr(lv("p10")+sv("p10"),0)}</b></div>
      <div class="num"><span>Typical (median)</span><b class="big">${inr(lv("p50")+sv("p50"),0)}</b></div>
      <div class="num"><span>Strong (1 in 10 better)</span><b>${inr(lv("p90")+sv("p90"),0)}</b></div></div>
      <p class="sub" style="margin:10px 0 0">Worst period: ${inr(lump*pl.worst + (ps ? sip*ps.worst : 0),0)}. Biggest fall along the way: ${proj.max_drawdown_pct}% (monthly data). ${months ? "STP results land between the lump-sum and SIP figures." : ""}
      ${(proj.notes||[]).length ? "<br>Note: " + proj.notes.map(esc).join("; ") + "." : ""} Past returns don't guarantee future returns.</p>`;
  }
  h += `</div>`;
  // Evidence
  const ev = d.evidence || [];
  if(ev.length) h += `<h2>Active funds vs index funds</h2><div class="card scroll"><table class="mt"><tr><th>Category</th><th>Years</th><th>Beat the index</th><th>Index / median active</th></tr>` +
    ev.map(e => `<tr><td>${esc(e.category)}</td><td>${e.years}</td><td>${e.beat_index} of ${e.active_funds}</td><td>${e.index_cagr}% / ${e.median_active_cagr}%</td></tr>`).join("") +
    `</table><p class="sub" style="margin:8px 0 0">Direct plans, after fees. Only funds that still exist are counted – closed losers are missing, which flatters active funds. That's why the plan uses index funds as its core.</p></div>`;
  h += `</div><div>`;
  // Leaderboards
  h += `<h2>Best funds by category</h2>` + Object.entries(d.buckets).filter(([k,b]) => b.top.length).map(([k,b]) =>
    `<details class="card pick"><summary><div class="row1"><b>${esc(b.label)}</b><span class="tag ${b.kind==="index"?"p":"b"}">${b.funds_considered} funds</span></div>
      <div class="sub" style="margin:6px 0 0">#1 ${esc(b.top[0].name)}</div></summary><div class="more"><table>` +
      b.top.map((f,i) => `<tr><td>${i+1}. ${esc(f.name)}<br><span class="sub">${esc(f.why)} · ${f.age_years} yrs old</span></td><td style="white-space:nowrap">3y&nbsp;${num(f.cagr_3y)}%<br>5y&nbsp;${f.cagr_5y == null ? "–" : f.cagr_5y + "%"}<br>fall&nbsp;${num(f.max_dd)}%</td></tr>`).join("") +
    `</table></div></details>`).join("");
  h += `<h2>Rules for long-term investing</h2><div class="card rules"><ul style="margin:0;padding-left:18px">${d.rules.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
    <p class="sub" style="margin:8px 0 0">${esc(d.universe.source)}; categories from ${esc(d.universe.categories)}. A screen, not investment advice.</p></div>`;
  h += `</div></div>`;
  $("#app").innerHTML = h;
  document.querySelectorAll("[data-mf]").forEach(b => b.onclick = () => { const s2 = mfState(); s2[b.dataset.mf] = b.dataset.v; mfSave(s2); renderMF(); });
  const upd = (id, key) => { const el = $(id); el.onchange = () => { const s2 = mfState(); s2[key] = Math.max(0, +el.value || 0); mfSave(s2); renderMF(); }; };
  upd("#mf-lump", "lump"); upd("#mf-sip", "sip");
}

// ---------------- Paper record ----------------
let SL = null;
async function loadPaper(){

  catch(e){

  }

function gateRow(label, ok, detail){ return `<tr><td>${label}</td><td>${detail}</td><td>${ok ? '<span class="pos">✓</span>' : '<span class="neg">✗</span>'}</td></tr>`; }
function renderPaper(L){
  const m = L.metrics || {};
  $("#asof").textContent = `Paper account since ${L.started} · last update ${L.last_date} · strategy: ${L.strategy === "adaptive" ? "regime-adaptive" : "baseline funnel"}`;
  let h = L.demo ? `<div class="banner warn">Demo record on made-up data – your real paper record starts with the next scan.</div>` : "";
  const days = L.started ? Math.round((Date.parse(L.last_date) - Date.parse(L.started)) / 864e5) : 0;
  h += `<div class="banner ${L.return_pct >= 0 ? "ok" : "bad"}">Paper equity ₹${Math.round(L.equity).toLocaleString("en-IN")} · ${L.return_pct >= 0 ? "+" : ""}${L.return_pct}% on ₹${L.capital.toLocaleString("en-IN")} · ${(L.open_positions||[]).length} open · ${m.trades || 0} closed</div>`;
  h += `<div class="layout"><div>`;
  h += `<h2>Paper equity</h2><div class="card">${equityChart([{label:"Paper account", data:L.equity_curve || {}, color:"#0B4D2E"}], null)}</div>`;
  const op = L.open_positions || [];
  h += `<h2>Open paper positions</h2><div class="card scroll">` + (op.length ? `<table class="mt"><tr><th>Stock</th><th>Qty</th><th>Entry</th><th>Stop</th><th>Last</th><th>P&amp;L</th></tr>` +
    op.map(p => `<tr><td>${esc(p.symbol)}</td><td>${p.qty}</td><td>${inr(p.entry)}</td><td>${inr(p.stop)}</td><td>${inr(p.last)}</td><td><span class="${p.unrealized>=0?"pos":"neg"}">${inr(p.unrealized,0)} (${p.r}R)</span></td></tr>`).join("") + `</table>` : `<div class="empty" style="padding:8px">No open positions.</div>`) + `</div>`;
  const q = L.queued || [];
  if(q.length) h += `<div class="card"><b>Paper orders for the next open:</b> ${q.map(x => `${esc(x.symbol)} (limit ${inr(x.limit)}, stop ${inr(x.stop)})`).join(" · ")}</div>`;
  const rt = L.recent_trades || [];
  h += `<h2>Closed paper trades</h2><div class="card scroll">` + (rt.length ? `<table class="mt"><tr><th>Stock</th><th>In → out</th><th>Exit</th><th>P&amp;L</th><th>R</th></tr>` +
    rt.map(t => `<tr><td>${esc(t.symbol)}</td><td>${fmtDate(t.entry_date)} → ${fmtDate(t.exit_date)}</td><td>${esc(t.reason)}</td><td><span class="${t.pnl>=0?"pos":"neg"}">${inr(t.pnl,0)}</span></td><td>${t.r}</td></tr>`).join("") + `</table>` : `<div class="empty" style="padding:8px">No closed trades yet.</div>`) + `</div>`;
  h += `</div><div>`;
  h += `<h2>Real-money gate</h2><div class="card scroll"><table class="mt"><tr><th>Condition</th><th>Now</th><th></th></tr>` +
    gateRow("3+ months of paper trading", days >= 90, `${days} days`) +
    gateRow("30+ closed trades", (m.trades||0) >= 30, `${m.trades || 0}`) +
    gateRow("Avg profit per trade ≥ 0.1R", (m.avg_r||0) >= 0.1, `${m.avg_r ?? "–"}R`) +
    gateRow("Worst fall from peak better than −10%", (m.max_drawdown_pct ?? 0) > -10, `${m.max_drawdown_pct ?? 0}%`) +
    `</table><p class="sub" style="margin:8px 0 0">All four, plus a backtest verdict that isn't "no proven edge", before any real money.</p></div>`;
  h += `<h2>Paper stats</h2><div class="card">${mtable(SL ? [["Technical", m], ["Sentiment-adjusted", SL.metrics || {}]] : [["Paper", m]])}</div>`;
  if(SL) h += `<div class="card"><b>Sentiment paper account:</b> ₹${Math.round(SL.equity).toLocaleString("en-IN")} (${SL.return_pct >= 0 ? "+" : ""}${SL.return_pct}%) · ${(SL.open_positions||[]).length} open · ${(SL.metrics||{}).trades || 0} closed since ${esc(SL.started || "–")}. Same rules and capital as the main paper account, but it only takes the sentiment-adjusted picks, at the risk the Market Mood allows.</div>`;
  const ev = L.events_log || L.events_latest || [];
  h += `<h2>Latest activity</h2><div class="card rules">${ev.length ? `<ul style="margin:0;padding-left:18px">${ev.slice().reverse().map(e => `<li>${esc(e)}</li>`).join("")}</ul>` : "No fills or exits yet."}</div>`;
  h += `</div></div>`;
  $("#app").innerHTML = h;
}

// ---------------- Strategy lab ----------------
async function loadLab(){
  try{ renderLab(await getJSON("backtest.json")); }
  catch(e){
    $("#asof").textContent = "Strategy lab";
    $("#app").innerHTML = `<div class="card empty">No backtest yet. Run <b>Strategy backtest</b> once from the Actions tab of your GitHub repo (the first run takes 1.5–3 hours); the results appear here.</div>`;

}
const pct = (v, sign=true) => v == null ? "–" : `<span class="${v>=0?"pos":"neg"}">${sign && v>0 ? "+" : ""}${v}%</span>`;
const num = v => v == null ? "–" : v;
function mtable(cols){
  const rows = [
    ["Annual return (CAGR)", m => pct(m.cagr_pct)], ["Worst fall from peak", m => pct(m.max_drawdown_pct, false)],
    ["Win rate", m => m.win_rate_pct == null ? "–" : m.win_rate_pct + "%"], ["Avg profit per trade (R)", m => num(m.avg_r)],
    ["Avg win / avg loss (R)", m => m.avg_win_r == null ? "–" : `${m.avg_win_r} / ${m.avg_loss_r}`],
    ["Profit factor", m => num(m.profit_factor)], ["Trades", m => num(m.trades)],
    ["Longest losing streak", m => num(m.max_losing_streak)], ["Avg days held", m => num(m.avg_days_held)]];
  return `<div class="scroll"><table class="mt"><tr><th></th>${cols.map(c=>`<th>${esc(c[0])}</th>`).join("")}</tr>` +
    rows.map(([lab, fn]) => `<tr><td>${lab}</td>${cols.map(c => `<td>${c[1] ? fn(c[1]) : "–"}</td>`).join("")}</tr>`).join("") + `</table></div>`;
}
function equityChart(series, oosStart){
  const W = 700, H = 260, padL = 52, padR = 10, padT = 10, padB = 24;
  const all = series.flatMap(s => Object.entries(s.data));
  if(!all.length) return "";
  const dates = [...new Set(all.map(x => x[0]))].sort();
  const t0 = Date.parse(dates[0]), t1 = Date.parse(dates[dates.length-1]);
  const vals = all.map(x => x[1]).filter(v => v > 0);
  const lo = Math.log(Math.min(...vals)), hi = Math.log(Math.max(...vals));
  const X = d => padL + (Date.parse(d) - t0) / Math.max(1, t1 - t0) * (W - padL - padR);
  const Y = v => padT + (hi - Math.log(v)) / Math.max(1e-9, hi - lo) * (H - padT - padB);
  let g = "";
  const ticks = 4;
  for(let k=0;k<=ticks;k++){ const v = Math.exp(lo + (hi-lo)*k/ticks); const y = Y(v);
    g += `<line x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${padL-6}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--muted)">₹${Math.round(v/1000)}k</text>`; }
  const years = [...new Set(dates.map(d => d.slice(0,4)))];
  years.forEach(yr => { const d = dates.find(x => x.startsWith(yr)); const x = X(d);
    g += `<text x="${x}" y="${H-6}" font-size="10" fill="var(--muted)">${yr}</text>`; });
  if(oosStart){ const x = X(oosStart); g += `<rect x="${x}" y="${padT}" width="${W-padR-x}" height="${H-padT-padB}" fill="var(--soft)" opacity=".7"/>` +
    `<text x="${x+4}" y="${padT+12}" font-size="10" fill="var(--muted)">unseen years →</text>`; }
  series.forEach(s => { const pts = Object.entries(s.data).filter(e=>e[1]>0).map(([d,v]) => `${X(d).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
    g += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="${s.w||2}" stroke-linejoin="round"/>`; });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Equity curves">${g}</svg>
    <div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.label)}</span>`).join("")}</div>`;
}
function renderLab(d){
  const B = d.strategies.baseline, A = d.strategies.adaptive, N = d.nifty || {};
  $("#asof").textContent = `Backtest ${d.data.start} → ${d.data.end} · ${d.data.symbols.toLocaleString("en-IN")} stocks · run ${new Date(d.generated_at).toLocaleDateString("en-IN")}`;
  const v = d.verdict || {}, cls = {adaptive:"ok", baseline:"ok", none:"bad"}[v.recommended] || "warn";
  let h = d.demo ? `<div class="banner warn">Demo backtest on made-up data – it only shows how the lab works. Real results appear after the first GitHub backtest run.</div>` : "";
  h += `<div class="banner ${cls}">Verdict: ${v.recommended === "adaptive" ? "use regime-adaptive momentum" : v.recommended === "baseline" ? "keep the current funnel" : "no proven edge yet – don't trade real money"}<br><span style="font-weight:400">${(v.summary||[]).map(esc).join(" ")}</span></div>`;
  h += `<div class="layout"><div>`;
  h += `<h2>Unseen years (from ${esc(d.oos_start)})</h2><div class="card">${mtable([["Baseline", B.out_of_sample], ["Adaptive", A.out_of_sample]])}</div>`;
  const cap = d.capital || 35000;
  h += `<h2>Growth of ₹${Math.round(cap).toLocaleString("en-IN")}</h2><div class="card">${equityChart([
      {label:"Nifty 50 (buy & hold)", data:N.equity||{}, color:"#A7AE9F", w:1.5},
      {label:"Baseline funnel", data:B.equity, color:"#0B4D2E"},
      {label:"Regime-adaptive", data:A.equity, color:"#E8B000", w:2.5}], d.oos_start)}</div>`;
  h += `<h2>Design years (before ${esc(d.oos_start)})</h2><div class="card">${mtable([["Baseline", B.in_sample], ["Adaptive", A.in_sample]])}</div>`;
  h += `<h2>Whole period</h2><div class="card">${mtable([["Baseline", B.all], ["Adaptive", A.all], ["Nifty", N.all]])}</div>`;
  h += `</div><div>`;
  const yrs = [...new Set([...Object.keys(B.yearly||{}), ...Object.keys(A.yearly||{})])].sort();
  h += `<h2>Year by year</h2><div class="card scroll"><table class="mt"><tr><th>Year</th><th>Baseline</th><th>Adaptive</th><th>Nifty</th></tr>` +
    yrs.map(y => `<tr><td>${y}</td><td>${pct(B.yearly[y])}</td><td>${pct(A.yearly[y])}</td><td>${pct((N.yearly||{})[y])}</td></tr>`).join("") + `</table></div>`;
  const rgs = A.by_regime || {};
  h += `<h2>Adaptive: trades by regime</h2><div class="card scroll"><table class="mt"><tr><th>Regime</th><th>Trades</th><th>Win %</th><th>Avg R</th></tr>` +
    ["green","amber"].filter(k => rgs[k]).map(k => `<tr><td><span class="rg ${k}">${k.toUpperCase()}</span></td><td>${rgs[k].trades}</td><td>${rgs[k].win_rate_pct}%</td><td>${rgs[k].avg_r}</td></tr>`).join("") +
    `</table><p class="sub" style="margin:8px 0 0">Time in each regime: ${Object.entries(d.regime_share||{}).map(([k,v]) => `${k} ${v}%`).join(" · ")}</p></div>`;
  h += `<h2>Robustness (adaptive, settings nudged)</h2><div class="card scroll"><table class="mt"><tr><th>Change</th><th>CAGR</th><th>Max DD</th><th>PF</th><th>Trades</th></tr>` +
    (d.robustness||[]).map(r => `<tr><td>${esc(r.label)}</td><td>${pct(r.cagr_pct)}</td><td>${pct(r.max_drawdown_pct,false)}</td><td>${num(r.profit_factor)}</td><td>${num(r.trades)}</td></tr>`).join("") + `</table></div>`;
  const fs = d.factor_study;
  if(fs){
    const cell = x => !x || x.hit_pct == null ? "–" : `<b>${x.hit_pct}%</b>${x.bottom_pct != null ? ` / ${x.bottom_pct}%` : ""}<br><span class="sub">${x.excess_pct>0?"+":""}${x.excess_pct}%</span>`;
    h += `<h2>Which ranking finds the top performers?</h2><div class="card"><div class="sub" style="margin:0 0 8px">${(fs.summary||[]).map(esc).join(" ")}</div>
      <div class="scroll"><table class="mt"><tr><th>Top ${fs.k} by…</th><th>1 week, design yrs</th><th>1 week, unseen</th><th>1 month, unseen</th></tr>` +
      fs.rankings.map(r => `<tr><td style="white-space:normal">${esc(r.label)}</td><td>${cell(r.in_sample["5d"])}</td><td>${cell(r.out_of_sample["5d"])}</td><td>${cell(r.out_of_sample["20d"])}</td></tr>`).join("") +
      `</table></div><p class="sub" style="margin:8px 0 0">Each cell: share of picks in the top 10% / bottom 10% of all liquid stocks (random = 10% / 10%), and the average return vs the median stock. Bought at the next open.</p></div>`;
  }
  h += `<h2>How it was tested</h2><div class="card rules"><ul style="margin:0;padding-left:18px">${(d.assumptions||[]).map(a => `<li>${esc(a)}</li>`).join("")}</ul></div>`;
  h += `</div></div>`;
  $("#app").innerHTML = h;
}

});
