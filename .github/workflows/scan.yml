name: Daily stock scan

on:
  schedule:
    # Mon–Fri. 14:00 UTC = 7:30 pm IST (after NSE publishes the day's bhavcopy).
    # 16:00 UTC = 9:30 pm IST backup run in case the file was late; it skips if already scanned.
    - cron: "0 14 * * 1-5"
    - cron: "0 16 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Scan the latest available day even if today's file is missing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tests
        run: python scanner/test_funnel.py

      - name: Restore price history
        uses: actions/cache/restore@v4
        with:
          path: data_cache
          key: nse-history-${{ github.run_id }}
          restore-keys: nse-history-

      - name: Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          FORCE: ${{ inputs.force && '1' || '' }}
        run: python scanner/run.py

      - name: Save price history
        if: always() && hashFiles('data_cache/history.csv.gz') != ''
        uses: actions/cache/save@v4
        with:
          path: data_cache
          key: nse-history-${{ github.run_id }}

      - name: Publish picks to the app
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Scan $(date -u +%F)"
          git pull --rebase
          git push
