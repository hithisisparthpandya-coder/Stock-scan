name: Live market update

# Every 15 minutes, Mon–Fri, 03:30–10:15 UTC (9:00 am – 3:45 pm IST). The script exits at once outside
# market hours or on NSE holidays, and saves one closing snapshot after 3:30 pm.
# GitHub's scheduler is best-effort: runs can start 5–20 minutes late at busy times.
on:
  schedule:
    - cron: "*/15 4-9 * * 1-5"
    - cron: "30,45 3 * * 1-5"
    - cron: "0,15 10 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even outside market hours"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: live-update
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: python scanner/test_sentiment.py
      - name: Live update
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          FORCE: ${{ inputs.force && '1' || '' }}
        run: python scanner/live.py
      - name: Publish to the app
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add docs/data/live.json
          git diff --cached --quiet && exit 0
          git commit -m "Live $(TZ=Asia/Kolkata date +'%F %H:%M') IST"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
