name: Mutual fund review

# Monthly refresh of fund rankings, model portfolios and outcome ranges (1st of each month, 6:30 pm IST).
on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 1 * *"

permissions:
  contents: write

concurrency:
  group: mf-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: python scanner/test_mf.py
      - name: Review funds
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner/mf.py
      - name: Publish to the app
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add docs/data/mf.json
          git diff --cached --quiet || git commit -m "Mutual fund review $(date -u +%F)"
          git pull --rebase
          git push
