name: Build Windows app

# Run manually (Actions → Build Windows app → Run workflow) after changing the UI or desktop code.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run dist:ci
      - uses: actions/upload-artifact@v4
        with:
          name: ATM-Stock-Scan-Setup
          path: desktop/dist/*.exe
